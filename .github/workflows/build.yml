name: Build & Deploy to itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export:
    name: Godot HTML5 Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          cp -r /root/.local/share/godot/export_templates/4.7.1.stable ~/.local/share/godot/export_templates/ || true

      - name: Generate desktop.ini
        run: |
          mkdir -p .github/workflows
          cat > "Desktop.ini" << 'EOF'
          [Desktop Entry]
          Type=Directory
          EOF

      - name: Export for HTML5
        run: |
          mkdir -p build
          godot --headless --export-release "Web" build/index.html

      - name: Create itch.io game folder
        run: |
          mkdir -p build/butler_upload
          # Copy all Godot Web export files
          cp build/index.html build/butler_upload/
          cp build/index.js build/butler_upload/ 2>/dev/null || true
          cp build/index.wasm build/butler_upload/ 2>/dev/null || true
          cp build/index.pck build/butler_upload/ 2>/dev/null || true
          cp build/index.audio.worklet.js build/butler_upload/ 2>/dev/null || true
          cp build/index.worker.js build/butler_upload/ 2>/dev/null || true
          cp build/index.asm.js build/butler_upload/ 2>/dev/null || true
          cp build/index.jpg build/butler_upload/ 2>/dev/null || true
          cp build/index.png build/butler_upload/ 2>/dev/null || true
          cp build/index.privided.gz build/butler_upload/ 2>/dev/null || true

      - name: Create .htaccess for MIME types
        run: |
          cat > build/butler_upload/.htaccess << 'EOF'
          <FilesMatch "\.(wasm|js|pck|wasm\.map)$">
            Header set Content-Type "application/wasm"
          </FilesMatch>
          <FilesMatch "\.(js)$">
            Header set Content-Type "application/javascript"
          </FilesMatch>
          <FilesMatch "\.(pck)$">
            Header set Content-Type "application/octet-stream"
          </FilesMatch>
          Header set Cross-Origin-Opener-Policy "same-origin"
          Header set Cross-Origin-Embedder-Policy "require-corp"
          Header set Cross-Origin-Resource-Policy "cross-origin"
          EOF

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: html5-build
          path: build/butler_upload/
          retention-days: 7

  deploy:
    name: Deploy to itch.io
    needs: export
    runs-on: ubuntu-latest
    steps:
      - name: Install unzip
        run: sudo apt-get install -y unzip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: html5-build
          path: butler_upload/

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCHIO_API_KEY }}
        run: |
          curl -Lfo butler.zip https://github.com/itchio/butler/releases/download/v15.30.0/butler-linux-amd64.zip
          unzip -j butler.zip 'linux-amd64/butler' -d .
          chmod +x butler
          ./butler push butler_upload/ ${{ vars.ITCHIO_GAME_ID }}:html --userversion ${{ github.run_number }}
